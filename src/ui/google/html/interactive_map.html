<!DOCTYPE html>
<html>
<head>
    <title>Interactive map</title>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <script
            src="https://maps.googleapis.com/maps/api/js?key=__API_KEY__&callback=initMap&libraries=marker"
            async defer>
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    let map;
    let marker;
    let bridge = null;

    function setCenter(lat, lng) {
        map.setCenter({ lat, lng });
    }

    function removeMarker() {
        if (marker) {
            marker.setMap(null);
            marker = null;
        }
    }

    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 6,
            center: { lat: 0, lng: 0 },
            disableDefaultUI: true,
            clickableIcons: false,
            mapId: "InteractiveMap"
        });

        new QWebChannel(qt.webChannelTransport, (channel) => {
            bridge = channel.objects.bridge;
            bridge.updateCenter.connect(setCenter);
            bridge.markerRemoveRequest.connect(removeMarker);
            bridge.onHtmlReady();
        });

        map.addListener("click", (event) => {
            const pos = event.latLng;

            if (marker) {
                marker.position = pos;
            } else {
                const pin = new google.maps.marker.PinElement({
                    background: "#0f9fea",
                    borderColor: "#594040",
                    glyphColor: "#000000",
                });
                marker = new google.maps.marker.AdvancedMarkerElement({
                    map,
                    position: pos,
                    content: pin.element,
                });
            }

            const lat = pos.lat();
            const lng = pos.lng();

            bridge.onCoordsChanged(lat, lng);
        });
    }
</script>
</body>
</html>
